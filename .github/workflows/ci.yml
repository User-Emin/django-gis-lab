name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["les-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgis:
        # Lab: PostgreSQL 17 + PostGIS 3.6.4; deze tag volgt PostGIS 3.6 op PG 17.
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-dummy-password
          POSTGRES_DB: ci_gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: projectkaart.settings.test
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ci.invalid
      DB_NAME: ci_gis
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASSWORD: ci-only-dummy-password
    steps:
      - uses: actions/checkout@v4

      - name: GDAL, GEOS en PROJ installeren
        timeout-minutes: 5
        run: |
          # Les 27: alleen de runtime-bibliotheken (geen -dev-pakketten, geen aanbevolen extra's),
          # met herhaalpogingen en een timeout per download; Django laadt GDAL/GEOS via ctypes.
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends gdal-bin
          echo "GDAL op de runner: $(gdalinfo --version)"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dependencies
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend bouwen (Vite-manifest voor de templates)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: SECRET_KEY genereren (alleen voor deze run)
        run: echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: GDAL en GEOS laden in Django
        run: uv run python -c "from django.contrib.gis import gdal, geos; print('GDAL', gdal.gdal_version().decode()); print('GEOS', geos.geos_version().decode())"

      - name: manage.py check --deploy (prod-instellingen, mag niet terugvallen)
        env:
          DJANGO_SETTINGS_MODULE: projectkaart.settings.prod
        run: uv run python manage.py check --deploy --fail-level WARNING

      - name: Dependency-audit (pip-audit op uv.lock, zonder dev-groep)
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: pytest met coverage
        run: uv run pytest -q --cov --cov-report=term-missing

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: dotnet build RcsCheck (NuGet-referenties AutoCAD.NET.Core/Model)
        run: dotnet build autocad/dotnet/RcsCheck -c Release

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write # alleen GITHUB_TOKEN, geen PAT; de push zelf gebeurt alleen op main en les-*-tags
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      previous_digest: ${{ steps.vorige.outputs.digest }}
      pushed: ${{ steps.doel.outputs.push }}
    env:
      IMAGE_NAME: ghcr.io/user-emin/django-gis-lab
      DB_PASSWORD: ci-only-dummy-password
    services:
      postgis:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-dummy-password
          POSTGRES_DB: ci_gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image bouwen (multi-stage, cache in GitHub Actions)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: django-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Grootte en lagen
        run: |
          docker image ls django-lab:ci
          echo "Grootte in bytes: $(docker image inspect django-lab:ci --format '{{.Size}}')"
          echo "Aantal lagen: $(docker image inspect django-lab:ci --format '{{len .RootFS.Layers}}')"
          docker history django-lab:ci

      - name: Versies in de image (GDAL, GEOS, Python, gebruiker)
        run: |
          docker run --rm --entrypoint python django-lab:ci -c "import sys; print('python', sys.version.split()[0])"
          docker run --rm --entrypoint id django-lab:ci
          docker run --rm -e DJANGO_SECRET_KEY=ci-dummy -e DJANGO_ALLOWED_HOSTS=localhost --entrypoint python django-lab:ci manage.py shell -c "from django.contrib.gis import gdal, geos; print('GDAL', gdal.gdal_version().decode()); print('GEOS', geos.geos_version().decode())"

      - name: Rooktest, migrate en gunicorn tegen de PostGIS-service
        run: |
          # Wegwerp-sleutel, alleen voor deze run
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_SECRET_KEY
          ROOKTEST_UITGEBREID=1 scripts/ci/rooktest.sh django-lab:ci web

      - name: docker compose config
        run: docker compose config -q && echo "compose.yaml is geldig"

      - name: Pushen alleen op main en les-*-tags (PR-runs pushen nooit)
        id: doel
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && { [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/les-* ]]; }; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Inloggen bij GHCR (GITHUB_TOKEN)
        if: steps.doel.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Digest van de vorige uitrol (latest) vastleggen voor de rollback
        id: vorige
        if: steps.doel.outputs.push == 'true'
        run: |
          # Bij de allereerste push bestaat :latest nog niet; dan is er geen vorige digest.
          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:latest" --format '{{ .Manifest.Digest }}' 2>/dev/null || true)"
          echo "vorige digest (latest): ${digest:-<geen>}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Tags bepalen (sha-<7>, les-NN op tag, latest alleen van main)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Image pushen naar GHCR (push alleen buiten PR's)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.doel.outputs.push == 'true' }}
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Samenvatting
        run: |
          {
            echo "### Image"
            echo "- push: ${{ steps.doel.outputs.push }}"
            echo "- digest: \`${{ steps.push.outputs.digest }}\`"
            echo "- vorige digest: \`${{ steps.vorige.outputs.digest }}\`"
            echo "- tags:"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    needs: [test, dotnet, docker]
    if: needs.docker.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pauzeert tot de required reviewer van environment "productie" goedkeurt.
    environment:
      name: productie
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_NAME: ghcr.io/user-emin/django-gis-lab
      DB_PASSWORD: ci-only-dummy-password
    services:
      postgis:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-dummy-password
          POSTGRES_DB: ci_gis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Uitrollen op digest (pull, migrate, start, /health)
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_SECRET_KEY
          REF="$IMAGE_NAME@$DIGEST"
          docker pull "$REF"
          ROOKTEST_UITGEBREID=1 scripts/ci/rooktest.sh "$REF" web
          echo "UITGEROLD: $REF" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Rollback-oefening op de vorige digest
        env:
          VORIGE: ${{ needs.docker.outputs.previous_digest }}
          DIGEST: ${{ needs.docker.outputs.digest }}
        run: |
          if [ -z "$VORIGE" ]; then
            echo "Geen vorige digest (eerste push naar GHCR): rollback niet te oefenen in deze run."
            echo "ROLLBACK: overgeslagen, geen vorige digest" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "nieuw:  $DIGEST"
          echo "vorige: $VORIGE"
          DJANGO_SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_SECRET_KEY
          REF="$IMAGE_NAME@$VORIGE"
          docker pull "$REF"
          docker rm -f web
          scripts/ci/rooktest.sh "$REF" web
          echo "ROLLBACK OK naar $REF (migraties niet teruggedraaid)" | tee -a "$GITHUB_STEP_SUMMARY"
