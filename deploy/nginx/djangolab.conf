# nginx server-blok voor Projectkaart (les 34). Wordt in nginx.conf binnen `http { }` ingevoegd.
upstream djangolab {
    server 127.0.0.1:8701;
}

server {
    # Lab: 127.0.0.1:8793. Op een server in het ODC: listen 443 ssl; (zie TLS hieronder).
    listen 127.0.0.1:8793;
    server_name 127.0.0.1 localhost;

    # DXF-uploads: de app staat 10 MB toe (CAD_MAX_UPLOAD_BYTES); nginx standaard maar 1 MB -> 413.
    client_max_body_size 12m;

    # WARNING: TLS-terminatie. In het ODC is onbekend of nginx zelf TLS afhandelt of een
    # load balancer ervoor (zie les 34, onbekend). Hier is het plain http. Met TLS in nginx:
    #   listen 443 ssl;  ssl_certificate ...;  ssl_certificate_key ...;
    # en `proxy_set_header X-Forwarded-Proto $scheme;` blijft staan: Django leest die header
    # via SECURE_PROXY_SSL_HEADER (prod.py) om te weten dat de verbinding https was.

    location /static/ {
        # Let op de slash aan het eind: bij `location /static/` hoort `alias ...staticfiles/;`
        alias __STATIC_DIR__/;
        expires 1h;
    }

    location / {
        proxy_pass http://djangolab;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;   # iets boven gunicorn timeout (30s)
        proxy_redirect off;
    }
}
