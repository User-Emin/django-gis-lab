[project]
name = "django-lab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1,<6.2",
    "django-debug-toolbar>=8.0.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-gis>=1.3.0",
    "drf-spectacular>=0.30.0",
    "ezdxf>=1.4.5",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "shapely>=2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", "data/cad/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "projectkaart.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"
# pipeline/: aps_da (DA-client) en het Celery-schets rcs_tasks staan buiten een Django-app
pythonpath = ["pipeline", "pipeline/django-integratie"]
testpaths = ["kaart", "cad", "autocad", "pipeline"]

[tool.coverage.run]
source = ["kaart"]
omit = ["*/migrations/*", "*/tests/*", "kaart/management/*"]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint.per-file-ignores]
# autocad/: lessen-scripts met lange docstrings/uitvoerregels; regels worden daar bewust niet afgebroken
"autocad/**" = ["E501"]
