[project]
name = "django-lab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-debug-toolbar>=8.0.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-gis>=1.3.0",
    "drf-spectacular>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "projectkaart.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["kaart"]
omit = ["*/migrations/*", "*/tests/*", "kaart/management/*"]

[tool.coverage.report]
show_missing = true
