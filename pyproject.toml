[project]
name = "django-lab"
version = "0.1.1"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1,<6.2",
    "django-debug-toolbar>=8.0.0",
    "django-filter>=26.2",
    "djangorestframework>=3.18.3",
    "djangorestframework-gis>=1.3.0",
    "drf-spectacular>=0.30.0",
    "ezdxf>=1.4.5",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "redis>=8.1.0",
    "shapely>=2.2.0",
    "whitenoise>=6.12.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Les 30: alleen de eigen Django-pakketten in het wheel (geen frontend/, data/, scripts/ enz.)
include = ["projectkaart*", "kaart*", "cad*"]

[tool.uv]
# Het project wordt niet in de venv geïnstalleerd (zoals voorheen); `uv build` bouwt het wel.
package = false

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "matplotlib>=3.11.2",
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations", "data/cad/gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "projectkaart.settings.test"
python_files = ["test_*.py"]
addopts = "-ra"
# pipeline/: aps_da (DA-client) en het Celery-schets rcs_tasks staan buiten een Django-app
pythonpath = ["pipeline", "pipeline/django-integratie"]
testpaths = ["kaart", "cad", "autocad", "pipeline"]

[tool.coverage.run]
# les 31: dekking over alle Python-pakketten die SonarQube als bron ziet. source = "." met
# relative_files geeft padnamen vanaf de repo-root; Sonar koppelt anders bestanden met dezelfde
# naam (models.py, views.py in kaart/ en cad/) aan het verkeerde pakket.
source = ["."]
relative_files = true
omit = [
    ".venv/*", "*/migrations/*", "*/tests/*", "kaart/management/*", "manage.py",
    "scripts/*", "frontend/*", "ansible/*", "deploy/*", "werkplek/*", "data/*",
]

[tool.coverage.report]
show_missing = true

[tool.ruff.lint.per-file-ignores]
# autocad/: lessen-scripts met lange docstrings/uitvoerregels; regels worden daar bewust niet afgebroken
"autocad/**" = ["E501"]
