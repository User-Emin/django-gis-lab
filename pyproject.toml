[project]
name = "django-lab"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "django-debug-toolbar>=8.0.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.format]
quote-style = "double"
