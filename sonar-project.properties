# Les 31: SonarQube Community Build, lokaal op 127.0.0.1:8792.
# Host en token komen NIET hierin: ze worden meegegeven via SONAR_HOST_URL en SONAR_TOKEN.
sonar.projectKey=django-lab
sonar.projectName=django-lab
sonar.sources=kaart,cad,autocad,pipeline,projectkaart
sonar.tests=kaart,cad,autocad,pipeline
sonar.test.inclusions=**/test_*.py,**/tests/**
# De CLI-scanner (pysonar) analyseert geen C#/VB.NET (alleen SonarScanner for .NET; docs.sonarsource.com,
# Community Build, C#-pagina), en lisp/scr zijn geen ondersteunde talen: buiten de scan houden.
sonar.exclusions=autocad/dotnet/**,autocad/lisp/**,autocad/scr/**,autocad/testdata/**,**/migrations/**,**/static/**,**/node_modules/**,data/**,**/test_*.py,**/tests/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.sourceEncoding=UTF-8
